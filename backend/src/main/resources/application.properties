server.port=3000

# Database (override with environment variables instead of hardcoding credentials)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/community}
spring.datasource.username=${DB_USER:yash}
spring.datasource.password=${DB_PASSWORD:}

# JWT: secret must be at least 32 characters. Set JWT_SECRET in your environment.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-ms=7200000

# CORS
app.cors.allowed-origin=http://localhost:5173
